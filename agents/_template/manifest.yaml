# Capability declaration. The orchestrator selects agents by reading this —
# never by a hardcoded call. Validated in CI against backend/orchestration/schema/manifest.schema.json

id: <agent-id>                  # kebab-case, matches folder name
version: 0.1.0                  # semver; bump on every change, log eval delta in CHANGELOG.md
owns: "<the single decision this agent is authoritative for>"
verb: <identify|select|infer|route|schedule|score|package|capture>

requires_skills: []             # e.g. [vision, retrieval, confidence]
requires_packs: []              # e.g. [crop, region, language]

inputs_required: []             # case_bundle fields without which the agent cannot run
inputs_optional: []             # each must have a declared degradation in AGENT.md §4

output_schema: ./schema/claim.json

latency_p95_ms: 0
cost_estimate_units: 0
model_tier: standard            # small | standard | large | none

can_veto: false                 # true only for agronomic-safety
# Content safety is enforced by the gate around every agent, not by an agent.
writes_to_graph: false          # true only for context

degraded_behavior: "<what it returns on partial input>"
kill_switch_default: <escalate_to_expert|skip|fail_closed>

phase: P1                       # P1 | P1.5 | P2
